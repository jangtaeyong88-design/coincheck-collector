[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Public token-contract addresses under CoinGecko platform names; never credentials"
condition = "AND"
paths = ['''(^|/)data/asset_identity_cache\.json$''']
regexTarget = "match"
regexes = ['''(?:huobi-token|klay-token|hashkey-chain|secret)"\s*:\s*"(?:0x[0-9a-fA-F]{40}|secret1[0-9a-z]{38})"''']
